// Orubus AI — root build. Versions live in the VERSION file so a one-line
// diff bumps a release ("cloud" continuous delivery via GitHub Releases).
def ver = rootProject.file('VERSION').text.trim().split(/\s+/)
ext.appVersionName = ver[0]
ext.appVersionCode = (ver.length > 1 ? ver[1] : '1').toInteger()

plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
}
