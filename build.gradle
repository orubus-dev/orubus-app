// Orubus AI — root build. The plugins block must come first (Gradle rule);
// versions live in the VERSION file so a one-line diff ships a release.
plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
}

def ver = rootProject.file('VERSION').text.trim().split(/\s+/)
ext.appVersionName = ver[0]
ext.appVersionCode = (ver.length > 1 ? ver[1] : '1').toInteger()
