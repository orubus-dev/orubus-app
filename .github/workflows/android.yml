name: android

on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle.properties', 'settings.gradle', 'build.gradle', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Optional: force a release tag (e.g. v1.0.1-hotfix). Empty = VERSION file.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read version
        id: ver
        run: |
          V=$(cut -d' ' -f1 VERSION | tr -d '[:space:]')
          C=$(cut -d' ' -f2 VERSION | tr -d '[:space:]')
          if [ -n "${{ github.event.inputs.force_tag }}" ]; then V=${{ github.event.inputs.force_tag }}; V=${V#v}; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "Building Orubus v$V (code $C)"

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/orubus-release.jks"
            echo "ORUBUS_KEYSTORE=$RUNNER_TEMP/orubus-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building UNSIGNED"
          fi

      - name: Assemble release
        env:
          ORUBUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORUBUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORUBUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p "$GITHUB_WORKSPACE" assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/Orubus.apk
          ls -la "$APK"
          if [ -f "$RUNNER_TEMP/orubus-release.jks" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -5
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orubus-v${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/release/Orubus.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (the update channel)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.name }}
        run: |
          APK=app/build/outputs/apk/release/Orubus.apk
          NOTES=$(printf 'Orubus AI for Android — v%s\n\n- live chat, tuned for more usage and faster replies\n- the requests wall\n- your Soul Units wallet\n- legal-first onboarding, GENJ token link\n\nInstall: open the APK, allow "install unknown apps" if asked, install over any previous version.' "${{ steps.ver.outputs.name }}")
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Orubus AI $TAG" --notes "$NOTES"
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Orubus.apk"
