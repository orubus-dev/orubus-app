plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Firebase config (google-services.json) — AdMob, Analytics (DAU/WAU/MAU
    // also stream to Orubus's own console), crash reporting. No legacy
    // service-account keys anywhere: the JSON config is all this needs.
    id 'com.google.gms.google-services'
}

android {
    namespace 'app.orubus.ai'
    compileSdk 34

    defaultConfig {
        applicationId 'app.orubus.ai'
        minSdk 24
        targetSdk 34
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
        // One ABI: arm64-v8a covers every real phone since ~2016. The WebRTC
        // native lib alone costs ~43MB across all four ABIs — this single
        // line is the reason the APK dropped from 49.7MB to ~18MB. Emulator
        // testing uses the web client; phones get everything.
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            // CI injects these via env (GitHub Actions secrets). Missing env
            // = unsigned local build — assembleRelease still succeeds.
            def ksPath = System.getenv('ORUBUS_KEYSTORE')
            if (ksPath != null && !ksPath.isBlank()) {
                storeFile file(ksPath)
                storePassword System.getenv('ORUBUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ORUBUS_KEY_ALIAS')
                keyPassword System.getenv('ORUBUS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ORUBUS_KEYSTORE') != null && !System.getenv('ORUBUS_KEYSTORE').isBlank()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                outputFileName = 'Orubus.apk' // stable name → stable "latest" download URL
            }
        }
    }
}

dependencies {
    // AdMob — the app-open + rewarded SU ads. Unit ids are NEVER baked in:
    // they arrive from our own server at load time (api/chat action 'adconfig',
    // signed-build attestation), so swapping/rotating units is a server change,
    // and a modded binary has no ids to strip.
    // Firebase BoM — Analytics (the user's console gets native DAU/etc too).
    // 33.7.0 = the newest line that stays on compileSdk 34 (this build's AGP);
    // bump together with the Android Gradle Plugin, never ahead of it.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    // OkHttp — the request engine's HTTP lane: one pooled client, one steady
    // pinned IP for every duck.ai call (Dns pinning), HTTP/2 keep-alive.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // bzip2 decoder for the delta updater — Bspatch.kt streams the patch's
    // payload through it. Pure Java, zero transitive baggage.
    implementation 'org.apache.commons:commons-compress:1.21'
    // WebRTC — the LIVE voice session (the native realtime call: mic up,
    // assistant audio down, transcript data channel). stream-webrtc-android
    // is Google's libwebrtc repacked for Maven Central.
    implementation 'io.getstream:stream-webrtc-android:1.3.8'
}
