    head: null,
    documentElement: null,
    createElement: function (t) { return makeElementShim(String(t).toLowerCase(), appended); },
    querySelector: function (sel) {
      var q = String(sel);
      if (/^meta\b/i.test(q) && /http-equiv/i.test(q) && /content-security-policy/i.test(q)) {
        return {
          nodeType: 1,
          tagName: 'META',
          __ctor: 'HTMLMetaElement',
          content: SRCDOC_CSP,
          getAttribute: function (n) {
            var a = String(n).toLowerCase();
            if (a === 'content') return SRCDOC_CSP;
            if (a === 'http-equiv') return 'Content-Security-Policy';
            return null;
          }
        };
      }
      return null;
    },
    querySelectorAll: function () { return makeNodeList([]); },
    getElementById: function () { return null; },
    getElementsByTagName: function () { return []; },
    getElementsByClassName: function () { return []; },
    addEventListener: function () {},
    removeEventListener: function () {},
    hasFocus: function () { return true; },
    createEvent: function () { return { initEvent: function () {} }; },
    createTextNode: function () { return { textContent: '' }; }
  };
  srcdocDoc.body = makeElementShim('body', appended);
  srcdocDoc.documentElement = makeElementShim('html', appended);
  srcdocDoc.head = makeElementShim('head', appended);
  winRef.__srcdocDoc = srcdocDoc;

  // Function-parameter shadowing = the vm context: every name below resolves
  // to the shim, everything fingerprint-y outside it reads undefined.
  var sandbox = {
    navigator: fakeWin.navigator,
    document: documentShim,
    location: fakeWin.location,
    screen: fakeWin.screen,
    history: fakeWin.history,
    performance: fakeWin.performance,
    getComputedStyle: fakeWin.getComputedStyle,
    matchMedia: fakeWin.matchMedia,
    requestAnimationFrame: fakeWin.requestAnimationFrame,
    cancelAnimationFrame: fakeWin.cancelAnimationFrame,
    crypto: fakeWin.crypto,
    window: fakeWin,
    self: fakeWin,
    top: fakeWin.top,
    parent: fakeWin.parent,
    frames: fakeWin.frames,
    globalThis: fakeWin,
    Promise: Promise, Math: Math, Error: Error, Object: Object, Array: Array, JSON: JSON,
    String: String, Number: Number, Boolean: Boolean,
    parseInt: parseInt, parseFloat: parseFloat, isNaN: isNaN, isFinite: isFinite,
    encodeURIComponent: encodeURIComponent, decodeURIComponent: decodeURIComponent,
    Symbol: Symbol, Proxy: Proxy,
    setTimeout: setTimeout, clearTimeout: clearTimeout, setInterval: setInterval, clearInterval: clearInterval,
    console: { log: function () {}, warn: function () {}, error: function () {} }
  };
  for (var ci = 0; ci < DOM_CTORS.length; ci++) sandbox[DOM_CTORS[ci]] = domCtor(DOM_CTORS[ci]);

  var DENY = ['chrome', 'opr', 'safari', 'InstallTrigger', 'phantom', 'callPhantom',
    '__phantomas', 'domAutomation', 'domAutomationController', 'spawn', 'emit', 'webdriver'];

  var keys = Object.keys(sandbox).concat(DENY);
  var vals = [];
  for (var vi = 0; vi < keys.length; vi++) vals.push(sandbox[keys[vi]]);
  var wrapped = '(async () => { ' +
    String(challengeSrc)
      .replace(/^\(async function\(\)\s*\{/, '')
      .replace(/\}\)\(\)\s*$/, '') +
    ' })()';
  var fn = new Function(keys.join(','), '"use strict";\nreturn ' + wrapped + ';');
  return fn.apply(null, vals);
}

// ---------- wrap + headers ----------
function wrapChallenge(raw, entryVer) {
  var hashed = [];
  for (var i = 0; i < raw.client_hashes.length; i++) hashed.push(sha256b64(String(raw.client_hashes[i])));
  var meta = {};
  if (raw.meta && typeof raw.meta === 'object') {
    for (var mk in raw.meta) meta[mk] = raw.meta[mk];
  }
  meta.origin = 'https://duck.ai';
  meta.stack = 'Error\n    at l (https://duck.ai/dist/duckai-dist/entry.duckai.' + entryVer + '.js:2:2129843)\n    at async https://duck.ai/dist/duckai-dist/entry.duckai.' + entryVer + '.js:2:1860421';
  meta.duration = '22';
  return b64utf8(JSON.stringify({
    server_hashes: raw.server_hashes,
    client_hashes: hashed,
    signals: raw.signals || {},
    meta: meta
  }));
}

function feSignals() {
  var evs = [];
  var acc = 80 + Math.floor(Math.random() * 120);
  evs.push({ name: 'onboarding_impression', delta: acc });
  acc += 900000 + Math.floor(Math.random() * 400000);
  evs.push({ name: 'action', delta: acc, trusted: false });
  acc += 40 + Math.floor(Math.random() * 90);
  evs.push({ name: 'onboarding_finish', delta: acc });
  acc += 60 + Math.floor(Math.random() * 140);
  evs.push({ name: 'startNewChat_free', delta: acc });
  acc += 4 + Math.floor(Math.random() * 12);
  return b64utf8(JSON.stringify({ start: Date.now(), events: evs, end: acc }));
}

// ---------- entry point ----------
async function solveAsync(challengeB64, ua, entryVer) {
  try {
    var src = utf8FromB64(challengeB64);
    var raw = solveChallenge(src, ua);
    if (raw && typeof raw.then === 'function') raw = await raw;
    if (!raw || typeof raw !== 'object') return { ok: false, error: 'solve:' + String(raw).slice(0, 60) };
    var s1 = String((raw.client_hashes && raw.client_hashes[1]) || '');
    var s2 = String((raw.client_hashes && raw.client_hashes[2]) || '');
    if (!/^\d{2,5}$/.test(s1) || !/^\d{2,5}$/.test(s2)) return { ok: false, error: 'bad-sigs:' + s1 + ',' + s2 };
    if (!raw.server_hashes || !raw.server_hashes.length || raw.server_hashes.length !== 3) return { ok: false, error: 'bad-serversig-shape' };
    return { ok: true, header: wrapChallenge(raw, entryVer || 'f1b96d6b68aa7e4766b9'), signals: feSignals() };
  } catch (e) {
    return { ok: false, error: 'solve:' + String((e && e.message) || e).slice(0, 120) };
  }
}

// id-tagged bridge: Kotlin calls evaluateJavascript("solveTagged('<id>','<b64>','<ua>')")
// and the result comes back through Android.solveDone(id, json) — a fresh
// challenge per call, no shared state.
async function solveTagged(id, challengeB64, ua, entryVer) {
  var r = await solveAsync(challengeB64, ua, entryVer);
  try { Android.solveDone(String(id), JSON.stringify(r)); } catch (e) {}
}
